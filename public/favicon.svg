<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-felt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115739"/>
      <stop offset="100%" stop-color="#041B11"/>
    </linearGradient>
    <linearGradient id="gold-trim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2CE74"/>
      <stop offset="100%" stop-color="#B08934"/>
    </linearGradient>
  </defs>
  <!-- Outer Obsidian Rounded Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#070A0F" stroke="url(#gold-trim)" stroke-width="2.5"/>
  <!-- Inner Tournament Emerald Felt Crest -->
  <polygon points="16,9 48,9 55,16 55,48 48,55 16,55 9,48 9,16" fill="url(#bg-felt)" stroke="rgba(226,184,87,0.35)" stroke-width="1"/>
  <!-- Corner Pocket Arc -->
  <path d="M 41 10 A 13 13 0 0 0 54 23" fill="none" stroke="#E2B857" stroke-width="1.5" opacity="0.65"/>
  <circle cx="49" cy="15" r="4.5" fill="#05070A" stroke="#E2B857" stroke-width="1.2"/>
  <!-- Trajectory Line from Cue Ball to Target Red -->
  <line x1="25" y1="39" x2="43" y2="21" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="3 2.5" stroke-linecap="round"/>
  <!-- Target Crimson Ball -->
  <circle cx="38" cy="26" r="5.5" fill="#E11D48"/>
  <circle cx="36.3" cy="24.3" r="1.6" fill="#FDA4AF"/>
  <!-- Tapered Ash Cue Stick -->
  <line x1="11" y1="53" x2="21" y2="43" stroke="#E2B857" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="19.5" y1="44.5" x2="22" y2="42" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
  <!-- Ivory Cue Ball -->
  <circle cx="25" cy="39" r="6.5" fill="#FAF7F0" stroke="#E2B857" stroke-width="1"/>
  <circle cx="23" cy="37" r="2" fill="#FFFFFF"/>
</svg>
